name: Build EcoSphere Desktop Installers

on:
  push:
    branches: [ main ]
    paths:
      - 'desktopApp/**'
      - 'sharedCore/**'
      - '.github/workflows/build-desktop-installers.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'desktopApp/**'
      - 'sharedCore/**'
      - '.github/workflows/build-desktop-installers.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '9.3.1'
      - name: Build Windows MSI
        shell: pwsh
        run: gradle -p desktopApp packageMsi --stacktrace
      - name: Collect Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $msi = Get-ChildItem -Path desktopApp/build/compose/binaries/main/msi -Filter *.msi -Recurse | Select-Object -First 1
          if (-not $msi) { throw 'MSI not found' }
          Copy-Item $msi.FullName dist/EcoSphere-1.3.0-Windows-x64.msi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: EcoSphere-Windows-Installer
          path: dist/EcoSphere-1.3.0-Windows-x64.msi
          if-no-files-found: error
          retention-days: 30

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y fakeroot
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '9.3.1'
      - name: Build Linux DEB
        run: gradle -p desktopApp packageDeb --stacktrace
      - name: Collect Linux installer
        run: |
          mkdir -p dist
          DEB=$(find desktopApp/build/compose/binaries/main/deb -name '*.deb' | head -n 1)
          test -n "$DEB"
          cp "$DEB" dist/EcoSphere-1.3.0-Linux-amd64.deb
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: EcoSphere-Linux-Installer
          path: dist/EcoSphere-1.3.0-Linux-amd64.deb
          if-no-files-found: error
          retention-days: 30
