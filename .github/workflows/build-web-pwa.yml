name: Build EcoSphere Web PWA

on:
  push:
    branches: [ main ]
    paths:
      - 'webApp/**'
      - '.github/workflows/build-web-pwa.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'webApp/**'
      - '.github/workflows/build-web-pwa.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test browser rules and diagnostics
        run: node --test webApp/tests/*.test.js
      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare PWA bundle
        run: |
          mkdir -p dist
          cp webApp/index.html webApp/styles.css webApp/app.js webApp/control-policy.js webApp/diagnostics.js webApp/history.js dist/
          cp webApp/manifest.webmanifest webApp/sw.js webApp/icon.svg dist/
          cp webApp/icon-192.png webApp/icon-512.png dist/
          cp -R webApp/icons dist/
          touch dist/.nojekyll
          cd dist
          zip -r ../EcoSphere-1.4.0-Web.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: EcoSphere-Web-PWA
          path: EcoSphere-1.4.0-Web.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
