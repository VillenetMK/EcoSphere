name: Build EcoSphere Web PWA

on:
  push:
    branches: [ main ]
    paths:
      - 'webApp/**'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/src/main/res/xml/**'
      - 'app/src/main/java/com/example/ecosphere/ui/mobile/MobileEcoSphereApp.kt'
      - 'desktopApp/src/main/kotlin/com/example/ecosphere/desktop/Main.kt'
      - 'firmware/**'
      - 'scripts/**'
      - 'supabase/**'
      - '.github/workflows/build-web-pwa.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'webApp/**'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/src/main/res/xml/**'
      - 'app/src/main/java/com/example/ecosphere/ui/mobile/MobileEcoSphereApp.kt'
      - 'desktopApp/src/main/kotlin/com/example/ecosphere/desktop/Main.kt'
      - 'firmware/**'
      - 'scripts/**'
      - 'supabase/**'
      - '.github/workflows/build-web-pwa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webApp/package-lock.json
      - name: Install pinned web dependencies
        run: npm ci --prefix webApp
      - name: Test browser, firmware and repository invariants
        run: |
          npm test --prefix webApp
          npm run check:copyright --prefix webApp
      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true
      - name: Prepare PWA bundle
        run: |
          mkdir -p dist
          npm run --prefix webApp build
          cp webApp/index.html webApp/styles.css webApp/android-auth-return.js dist/
          cp webApp/manifest.webmanifest webApp/sw.js webApp/icon.svg dist/
          cp webApp/icon-192.png webApp/icon-512.png dist/
          cp -R webApp/icons dist/
          touch dist/.nojekyll
          cd dist
          zip -r ../EcoSphere-1.6.10-Web.zip .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: EcoSphere-Web-PWA
          path: EcoSphere-1.6.10-Web.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
