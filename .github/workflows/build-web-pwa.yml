name: Build EcoSphere Web PWA

on:
  push:
    branches: [ main ]
    paths:
      - 'webApp/**'
      - '.github/workflows/build-web-pwa.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'webApp/**'
      - '.github/workflows/build-web-pwa.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare PWA bundle
        run: |
          mkdir -p dist
          cp -R webApp/. dist/
          cd dist
          zip -r ../EcoSphere-1.0.0-Web-PWA.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: EcoSphere-Web-PWA
          path: EcoSphere-1.0.0-Web-PWA.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
