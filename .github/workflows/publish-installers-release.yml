name: Publish EcoSphere Installers

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-installers-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Build Windows MSI
        shell: pwsh
        run: gradle -p desktopApp packageMsi --stacktrace
      - name: Collect Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $msi = Get-ChildItem -Path desktopApp/build/compose/binaries/main/msi -Filter *.msi -Recurse | Select-Object -First 1
          if (-not $msi) { throw 'MSI not found' }
          Copy-Item $msi.FullName dist/EcoSphere-1.1.0-Windows-x64.msi
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/EcoSphere-1.1.0-Windows-x64.msi
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y fakeroot
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Build Linux DEB
        run: gradle -p desktopApp packageDeb --stacktrace
      - name: Collect Linux installer
        run: |
          mkdir -p dist
          DEB=$(find desktopApp/build/compose/binaries/main/deb -name '*.deb' | head -n 1)
          test -n "$DEB"
          cp "$DEB" dist/EcoSphere-1.1.0-Linux-amd64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist/EcoSphere-1.1.0-Linux-amd64.deb
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Android APK
        run: |
          chmod +x gradlew
          ./gradlew :sharedCore:test :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/EcoSphere-1.1.0-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: dist/EcoSphere-1.1.0-Android.apk
          if-no-files-found: error

  release:
    needs: [ windows, linux, android ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify installers
        run: |
          test -s dist/EcoSphere-1.1.0-Windows-x64.msi
          test -s dist/EcoSphere-1.1.0-Linux-amd64.deb
          test -s dist/EcoSphere-1.1.0-Android.apk
          sha256sum dist/* > dist/SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v1.1.0
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "EcoSphere 1.1.0" --notes "Instaladores oficiales de EcoSphere para Windows, Linux y Android."
          fi
